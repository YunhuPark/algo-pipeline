name: Recovery CI

on:
  pull_request:
  push:
    branches:
      - "recovery/**"

permissions:
  contents: read

concurrency:
  group: recovery-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALGO_ENV: test
      OPENAI_API_KEY: test-key
      TAVILY_API_KEY: test-key
      ALGO_DB_PATH: /tmp/algo-recovery-ci.db
      TRACKING_DB_PATH: /tmp/tracking-recovery-ci.db

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -e . pytest

      - name: Check changed-file whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run isolated test suite
        shell: bash
        run: |
          before=$(find . -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' \) | wc -l)
          test "$before" -eq 0
          python -m pytest tests -q
          after=$(find . -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' \) | wc -l)
          test "$after" -eq 0
