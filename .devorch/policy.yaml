# DevOrch 정책 — 이 저장소에서 "틀리면 되돌리기 어려운" 파일을 소유자가 직접 지정한다.
# AI 에이전트가 이 경로를 바꾸면 DevOrch 가 위험도를 최소 아래 수준까지 올리고(내리지는 않음),
# 그 수준에 따라 독립 리뷰어와 사람 승인이 필요해진다. 이 파일만 두면 나머지 정책은 DevOrch 기본값을 쓴다.
#
# 사용: pip install devorch 후 `devorch policy accept` 로 사람이 한 번 승인해야 에이전트 도구가 동작한다
#       (승인한 정책과 달라지면 도구가 멈춘다). 너무 자주 걸리면 아래에서 medium 으로 낮추거나 항목을 지운다.
#
# 패턴 규칙: '/' 로 끝나면 폴더 전체, '/' 가 없으면 파일 이름(어느 폴더든), 그 외는 저장소 기준 경로(* 사용 가능).
protected_paths:
  # --- 발행(되돌릴 수 없는 외부 게시)
  - {pattern: src/agents/publisher.py, min_level: high}
  - {pattern: src/agents/threads_publisher.py, min_level: high}
  - {pattern: src/agents/content_queue.py, min_level: high}
  # --- 발행 큐 상태(중복 게시·승인 우회를 막는 가드가 있는 곳)
  - {pattern: src/db.py, min_level: high}
  - {pattern: src/queue_runtime.py, min_level: high}
  - {pattern: src/db_migration_queue.py, min_level: high}
  - {pattern: src/db_factory.py, min_level: high}
  # --- 무인 실행 스위치와 사람 승인
  - {pattern: src/automation_mode.py, min_level: critical}
  - {pattern: src/agents/approval.py, min_level: high}
  - {pattern: src/agent_control/, min_level: high}
  # --- 인증·토큰
  - {pattern: src/api/, min_level: high}
  - {pattern: scripts/get_ig_token.py, min_level: high}
  - {pattern: scripts/refresh_ig_token.py, min_level: high}
  # --- 사용자에게 자동으로 답글/DM 을 보내는 코드
  - {pattern: src/agents/comment_manager.py, min_level: high}
  - {pattern: src/agents/dm_manager.py, min_level: high}
  # --- 자동 실행 일정
  - {pattern: src/scheduler.py, min_level: high}
  - {pattern: run_daily.bat, min_level: medium}
  - {pattern: run_on_login.bat, min_level: medium}
  # --- 한 단계 낮게(리뷰어는 붙고 사람 승인은 없음): 너무 자주 걸리면 쓰기 어려운 곳
  - {pattern: src/dashboard/, min_level: medium}
  - {pattern: src/telegram_bot.py, min_level: medium}
  - {pattern: .github/workflows/, min_level: medium}
  # --- 가드 테스트를 약하게 만드는 변경(실패하는 테스트를 지워서 통과시키는 우회)
  - {pattern: "tests/test_*guard*.py", min_level: medium}
  - {pattern: tests/test_instagram_auth_security.py, min_level: medium}
